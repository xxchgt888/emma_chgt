<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emma Chataigné</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: "Source Code Pro", monospace;
      font-size: 20px;
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 22px 30px;
    }

    header a,
    .work a {
      color: inherit;
      text-decoration: none;
    }

    header a:hover,
    .work a:hover {
      text-decoration: underline;
    }

.site-name {
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 18px;
    }

    main {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
    }

.intro {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

.intro img {
  width: min(850px, 95%);
  max-height: 650px;
  object-fit: contain;
  margin-bottom: 24px;
}

    section {
      padding: 40px 0 70px;
      scroll-margin-top: 20px;
    }

    h2 {
      margin: 0 0 24px;
      font-size: 14px;
      font-weight: normal;
    }

.bio {
  max-width: 500px;
  margin: 0 auto;
  text-align: center;
  font-size: 12px;
    }

.work {
      padding: 18px 0;
      border-top: 1px solid #ddd;
    }

.work h3 {
  margin: 0 0 6px;
  font-size: 20px;
  font-weight: 500;
    }

.work p {
  max-width: 600px;
  margin: 0 0 14px;
  color: #111;
  font-size: 12px;
    }

.gallery {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 16px;
}

.gallery-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  align-items: center;
}

.gallery-row img {
  display: block;
  width: 100%;
  height: 280px;
  object-fit: contain;
  background: transparent;
}

footer {
      padding: 20px 30px 30px;
      color: #111;
      font-size: 12px;
    }

.brand {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.tagline {
  display: block;
  font-size: 12px;
  color: #555;
}

.home-links {
  display: flex;
  gap: 24px;
  margin-top: 18px;
}

.home-links a {
  color: #111;
  text-decoration: none;
}

.home-links a:hover {
  text-decoration: underline;
}
 @media (max-width: 600px) {
  header {
    padding: 18px 20px;
  }

  main {
    width: calc(100% - 40px);
  }

  .intro {
    min-height: 65vh;
  }

  .gallery-row {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
  
<body>
  <header>
    <div class="brand">
      <span class="site-name">Emma Chataigné</span>
      <span class="tagline">Visual artist, researcher and performer based in Geneva</span>
    </div>
  </header>

  <main>
  <div class="intro">
    <img src="images/couverture.png" alt="Image de couverture">

    <nav class="home-links">
      <a href="works.html">Works</a>
      <a href="biography.html">Biography</a>
      <a href="cv.html">CV</a>
    </nav>
  </div>
</main>

</body>
</html>
